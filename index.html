<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业</title>
<style>
  :root {
    --bg: #fdfcfa;
    --text: #1a1a1a;
    --muted: #6f6f6f;
    --line: #e6e3dd;
    --accent: #2f6b58;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101011;
      --text: #e9e8e5;
      --muted: #9a9a95;
      --line: #2a2a2c;
      --accent: #7dbba3;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    max-width: 36rem;
    margin: 0 auto;
    padding: 7rem 1.5rem 5rem;
  }

  /* 首屏 */
  .intro {
    animation: rise .7s ease both;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 .5rem;
    line-height: 1.3;
  }
  .tagline {
    color: var(--muted);
    margin: 0;
    font-size: 1.0625rem;
  }

  section {
    margin-top: 3.5rem;
    animation: rise .7s ease both;
  }
  section:nth-of-type(1) { animation-delay: .06s; }
  section:nth-of-type(2) { animation-delay: .12s; }
  section:nth-of-type(3) { animation-delay: .18s; }

  h2 {
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1.25rem;
  }

  p { margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }

  a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1px;
    transition: border-color .2s ease, color .2s ease;
  }
  a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* 列表式条目 */
  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: .5rem 0;
    border-bottom: 1px solid var(--line);
  }
  ul.list li:last-child { border-bottom: none; }
  ul.list .meta {
    color: var(--muted);
    font-size: .875rem;
    flex: none;
    font-variant-numeric: tabular-nums;
  }

  /* 链接行 */
  ul.links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
  }

  footer {
    margin-top: 5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .8125rem;
    animation: rise .7s ease both;
    animation-delay: .24s;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 480px) {
    main { padding: 4rem 1.25rem 3rem; }
    h1 { font-size: 1.5rem; }
    ul.list li { flex-direction: column; gap: .125rem; }
  }
</style>
</head>
<body>
<main>

  <div class="intro">
    <h1>Your Name</h1>
    <p class="tagline">用ai完成的项目</p>
  </div>

  <section>
    <h2>已完成</h2>
    <ul class="list">
      <li>
        <span><a href="#">项目一</a> — 做这个网站</span>
        <span class="meta">2026</span>
      </li>
      <li>
        <span><a href="#">项目二</a> — 无</span>
        <span class="meta">2025</span>
      </li>
      <li>
        <span><a href="#">项目三</a> — 无</span>
        <span class="meta">2025</span>
      </li>
    </ul>
  </section>

  <footer>
    © 2026 11e120
  </footer>

</main>
</body>
</html>
